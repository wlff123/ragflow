# Pre-ingestion sensitive processing rules.
# Rules 1-20 are copied verbatim from chapter 7 of the requirement document (source: requirement).
# Rule 21 is a supplement for multi-line private keys and certificates (source: supplement).
# Placeholders are "[敏感信息已移除：{display_name}]".
catalog_version: "2026.11.1"
rules:
  - id: SECRET_KV
    display_name: 密钥类
    source: requirement
    replace_scope: value_after_separator
    priority: 40
    pattern: '(?:secret|secret_key|token|secret_token|auth_token|access_token|username|password|aws_access_key_id|aws_secret_access_key|secretkey|authtoken|accesstoken|access-token|authkey|client_secret|bucket|email|HEROKU_API_KEY|SF_USERNAME|PT_TOKEN|id_dsa|clientsecret|client-secret|encryption-key|pass|encryption_key|encryptionkey|secret-key|bearer|JEKYLL_GITHUB_TOKEN|HOMEBREW_GITHUB_API_TOKEN|api_key|api_secret_key|api-key|private_key|client_key|client_id|sshkey|ssh_key|ssh-key|privatekey|DB_USERNAME|oauth_token|irc_pass|dbpasswd|xoxa-2|xoxr|consumer_key|consumer_secret|access_token_secret|SLACK_BOT_TOKEN|slack_api_token|api_token|ConsumerKey|ConsumerSecret|SESSION_TOKEN|session_key|session_secret|slack_token|slack_secret_token|bot_access_token|passwd|api|eid|sid|apikey|userid|user_id|user-id)["''\s]*(?::|=|=:|=>)["''\s]*[A-Za-z0-9_+\-/=]{8,64}["'']?'
  - id: CN_ID_CARD
    display_name: 身份证
    source: requirement
    replace_scope: full
    priority: 30
    pattern: '(?<![0-9A-Za-z])[1-9]\d{5}(?:18|19|20|3\d)\d{2}(?:0[1-9]|1[0-2])(?:[0-2][1-9]|10|20|30|31)\d{3}[0-9Xx](?![0-9A-Za-z])'
  - id: CN_MOBILE
    display_name: 手机号
    source: requirement
    replace_scope: full
    priority: 10
    pattern: '(?<![0-9A-Za-z])1(?:3\d|4[5-9]|5[0-35-9]|6[2567]|7[0-8]|8\d|9[0-35-9])\d{8}(?![0-9A-Za-z])'
  - id: BANK_CARD
    display_name: 银行卡
    source: requirement
    replace_scope: full
    priority: 20
    pattern: '(?<![0-9A-Za-z])\d{13,19}(?![0-9A-Za-z])'
  - id: ALIYUN_AK
    display_name: 阿里云 AccessKey ID
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])LTAI[A-Za-z0-9]{12,20}(?![0-9A-Za-z])'
  - id: TENCENT_SECRET_ID
    display_name: 腾讯云 SecretId
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])AKID[0-9A-Za-z]{32}(?![0-9A-Za-z])'
  - id: BAIDU_AK
    display_name: 百度云 AccessKey ID
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])ALTAK-?[0-9A-Za-z]{21}(?![0-9A-Za-z])'
  - id: JDCLOUD_AK
    display_name: 京东云 AccessKey ID
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])JDC_[0-9A-F]{28}(?![0-9A-Za-z])'
  - id: KSYUN_AK
    display_name: 金山云 AccessKey ID
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])AKLT[\w-]{20}(?![0-9A-Za-z])'
  - id: GCP_API_KEY
    display_name: Google Cloud API Key
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])AIza[0-9A-Za-z_-]{35}(?![0-9A-Za-z])'
  - id: GOOGLE_OAUTH_TOKEN
    display_name: Google OAuth Access Token
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])ya29\.[0-9A-Za-z_-]{22,}(?![0-9A-Za-z])'
  - id: AWS_API_KEY
    display_name: AWS API Key
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])AKIA[0-9A-Z]{16}(?![0-9A-Za-z])'
  - id: AWS_MWS_KEY
    display_name: AWS MWS Key
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])amzn\.mws\.[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}(?![0-9A-Za-z])'
  - id: GITHUB_PAT_FINE
    display_name: GitHub Personal Access Token（Fine-grained）
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])github_pat_[A-Za-z0-9_]{36,}(?![0-9A-Za-z])'
  - id: GITHUB_PAT
    display_name: GitHub Personal Access Token（Classic）
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])ghp_[A-Za-z0-9]{36}(?![0-9A-Za-z])'
  - id: GITHUB_OAUTH
    display_name: GitHub OAuth 2.0 Access Token
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])gho_[A-Za-z0-9]{36}(?![0-9A-Za-z])'
  - id: GITHUB_U2S
    display_name: GitHub User-to-Server Access Token
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])ghu_[A-Za-z0-9]{36}(?![0-9A-Za-z])'
  - id: GITHUB_S2S
    display_name: GitHub Server-to-Server Access Token
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])ghs_[A-Za-z0-9]{36}(?![0-9A-Za-z])'
  - id: GITHUB_REFRESH
    display_name: GitHub Refresh Token
    source: requirement
    replace_scope: full
    priority: 80
    pattern: '(?<![0-9A-Za-z])ghr_[A-Za-z0-9]{36}(?![0-9A-Za-z])'
  - id: DB_PASSWORD
    display_name: 数据库密码
    source: requirement
    replace_scope: full
    priority: 60
    pattern: '(?:mysql|postgres|postgresql|mssql|oracle|mongodb|sql):\/\/[^:\s/]+:[^@\s]+@[^:\s/]+(?::\d+)?(?:/[^\s?]+)?(?:\?[^\s]+)?'
  - id: PEM_BLOCK
    display_name: 私钥/证书
    source: supplement
    replace_scope: full
    priority: 100
    pattern: '-----BEGIN ((?:[A-Z0-9]+ )*(?:PRIVATE KEY(?: BLOCK)?|CERTIFICATE))-----(?:[\s\S]{0,16384}?-----END \1-----|[A-Za-z0-9+/=\s\\:,\-]*)'
